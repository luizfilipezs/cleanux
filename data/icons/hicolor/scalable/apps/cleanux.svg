<?xml version="1.0" encoding="UTF-8"?>
<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="64" y1="8" x2="64" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    
    <!-- Disk Gradient -->
    <linearGradient id="disk-grad" x1="32" y1="36" x2="96" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#E2E8F0" stop-opacity="0.85" />
    </linearGradient>
    
    <!-- Sparkle / Accent Gradient -->
    <linearGradient id="accent-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="shadow" x="12" y="14" width="104" height="106" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#064E3B" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- App Squircle Base with Shadow -->
  <rect x="16" y="16" width="96" height="96" rx="26" fill="url(#bg-grad)" filter="url(#shadow)" />

  <!-- Subtle Top Highlight Border -->
  <rect x="17" y="17" width="94" height="94" rx="25" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1.5" />

  <!-- Hard Drive Disk Stylized Ring -->
  <circle cx="64" cy="64" r="32" stroke="url(#disk-grad)" stroke-width="7" stroke-dasharray="140 30" stroke-linecap="round" />
  <circle cx="64" cy="64" r="16" fill="url(#disk-grad)" opacity="0.9" />
  <circle cx="64" cy="64" r="7" fill="#047857" />

  <!-- Cleaning Sparkle (Top Right) -->
  <path d="M88 32 C88 38 92 42 98 42 C92 42 88 46 88 52 C88 46 84 42 78 42 C84 42 88 38 88 32 Z" fill="#FDE047" />

  <!-- Small Sparkle (Bottom Left) -->
  <path d="M38 78 C38 81 40 83 43 83 C40 83 38 85 38 88 C38 85 36 83 33 83 C36 83 38 81 38 78 Z" fill="#38BDF8" />

  <!-- Fast Broom / Sweep Trail -->
  <path d="M46 44 L58 56 M52 38 L68 54" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-opacity="0.8" />
</svg>
